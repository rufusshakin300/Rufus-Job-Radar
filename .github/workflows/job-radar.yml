name: Rufus Job Radar

on:
  workflow_dispatch:
  schedule:
    # 09:00 AM India Standard Time (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: rufus-job-radar
  cancel-in-progress: false

jobs:
  job-radar:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore deduplication state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: job-radar-state-${{ github.run_id }}
          restore-keys: |
            job-radar-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run job radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save deduplication state
        uses: actions/cache/save@v5
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: job-radar-state-${{ github.run_id }}
