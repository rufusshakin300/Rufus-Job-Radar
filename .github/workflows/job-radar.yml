name: Rufus Job Radar

on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC. GitHub may occasionally delay scheduled runs.
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  job-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore deduplication state
        uses: actions/cache@v4
        with:
          path: state.json
          key: job-radar-state-${{ github.run_id }}
          restore-keys: |
            job-radar-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save deduplication state
        uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: job-radar-state-${{ github.run_id }}
